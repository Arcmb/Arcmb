# Meu Cronograma — Render + Neon. No credentials in this repository.
services:
  - type: web
    name: meucronograma
    runtime: python
    region: ohio
    plan: free
    branch: meucronograma
    autoDeployTrigger: commit
    buildCommand: bash build.sh
    startCommand: bash start.sh
    healthCheckPath: /readyz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: MASTER_USERNAME
        value: arcmb
      - key: MASTER_PASSWORD
        sync: false
      - key: ALLOWED_HOSTS
        value: meucronograma.onrender.com
      - key: PYTHONUNBUFFERED
        value: "1"
